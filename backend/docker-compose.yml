services:
  postgres:
    image: postgres:17
    container_name: adfluence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adfluence
      POSTGRES_PASSWORD: adfluence123
      POSTGRES_DB: adfluence_db
    ports:
      - "5433:5432"
    volumes:
      - adfluence_postgres_data:/var/lib/postgresql/data
      - ./migration:/docker-migrations:ro,z
      - ./docker/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adfluence -d adfluence_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: adfluence_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - adfluence_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: adfluence_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb local/adfluence-media --ignore-existing &&
      mc anonymous set download local/adfluence-media &&
      echo 'MinIO bucket adfluence-media ready'
      "
    restart: "no"

volumes:
  adfluence_postgres_data:
  adfluence_minio_data:
