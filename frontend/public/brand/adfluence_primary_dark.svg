    <polygon points="42,15 65,65 19,65" fill="none" stroke="white" stroke-width="4.5" stroke-linejoin="round"/>
    <line x1="26" y1="51" x2="58" y2="51" stroke="white" stroke-width="4.5"/>
    <circle cx="73" cy="13" r="13" fill="url(#orangeGrad)"/>
    <circle cx="73" cy="13" r="7" fill="white"/>
  </g>
  <!-- Wordmark -->
  <text x="124" y="66" font-family="Arial, sans-serif" font-weight="900" font-size="52" letter-spacing="-2">
    <tspan fill="white">Ad</tspan><tspan fill="#C084FC">flu</tspan><tspan fill="#FB923C">en</tspan><tspan fill="#C084FC">ce</tspan>
  </text>
  <!-- Tagline -->
  <text x="125" y="90" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" font-weight="600" fill="#6B21A8">ETHIOPIA'S CREATOR MARKETPLACE</text>
