services:
  - type: web
    name: adfluence-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: adfluence-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://localhost:3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_TTL
        value: 15m
      - key: JWT_REFRESH_TOKEN_TTL
        value: 168h
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: info

databases:
  - name: adfluence-postgres
    plan: free
    region: oregon
    databaseName: adfluence_db
    user: adfluence
